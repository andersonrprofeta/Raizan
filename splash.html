<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Raizan Core</title>
<style>
  :root { --violeta: #8b5cf6; --lilas: #c4b5fd; --azul: #4f46e5; --texto: #ffffff; --apagado: rgba(255,255,255,.55); --linha: rgba(255,255,255,.09); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: var(--texto); -webkit-font-smoothing: antialiased; user-select: none; cursor: default; }

  /* A margem da janela transparente é o que deixa a sombra aparecer */
  .palco { position: absolute; inset: 14px; transition: opacity .42s ease, transform .5s cubic-bezier(.16,1,.3,1); }
  .saindo .palco { opacity: 0; transform: scale(1.05); }

  .cartao { position: relative; width: 100%; height: 100%; display: grid; grid-template-rows: 1fr auto; overflow: hidden; border-radius: 26px; border: 1px solid rgba(255,255,255,.1); background: linear-gradient(145deg, #0e0c1a 0%, #08080f 55%, #0b0a18 100%); box-shadow: 0 10px 14px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08); }

  .luz { position: absolute; border-radius: 50%; filter: blur(70px); pointer-events: none; }
  .luz.a { width: 460px; height: 460px; top: -190px; left: -110px; background: rgba(124,58,237,.34); animation: flutuar 9s ease-in-out infinite alternate; }
  .luz.b { width: 420px; height: 420px; bottom: -190px; right: -80px; background: rgba(79,70,229,.3); animation: flutuar 11s ease-in-out infinite alternate-reverse; }
  .grade { position: absolute; inset: 0; opacity: .5; background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); background-size: 26px 26px; -webkit-mask-image: radial-gradient(ellipse at 70% 45%, #000, transparent 72%); }

  .conteudo { position: relative; display: grid; grid-template-columns: 1fr 470px; min-height: 0; }
  .marca { display: flex; flex-direction: column; justify-content: center; padding: 0 0 8px 56px; }

  .simbolo { width: 84px; height: 84px; border-radius: 22px; overflow: hidden; box-shadow: 0 16px 40px rgba(109,40,217,.5), inset 0 0 0 1px rgba(255,255,255,.14); opacity: 0; animation: surgir .8s cubic-bezier(.16,1,.3,1) .1s forwards; }
  /* O PNG tem bordas sujas fora do quadrado: o zoom e o recorte deixam só o símbolo */
  .simbolo img { display: block; width: 100%; height: 100%; object-fit: cover; transform: scale(1.27); }

  .laboratorio { margin-top: 26px; font-size: 12px; font-weight: 700; letter-spacing: .32em; color: var(--lilas); opacity: 0; animation: focar .8s ease .55s forwards; }
  h1 { margin-top: 8px; font-size: 56px; line-height: 1.04; font-weight: 700; letter-spacing: -.03em; opacity: 0; animation: focar 1s ease .7s forwards; }
  h1 span { background: linear-gradient(100deg, #fff 20%, var(--lilas) 100%); -webkit-background-clip: text; color: transparent; }

  .frase { position: relative; height: 26px; margin-top: 12px; font-size: 17px; color: var(--apagado); opacity: 0; animation: aparecer .7s ease 1.2s forwards; }
  .frase p { position: absolute; inset: 0; transition: opacity .45s ease, transform .45s ease; }

  .etapa { display: flex; align-items: center; gap: 11px; margin-top: 44px; font-size: 13.5px; color: rgba(255,255,255,.72); opacity: 0; animation: aparecer .6s ease 1.5s forwards; }
  .pulso { width: 8px; height: 8px; border-radius: 50%; background: var(--violeta); box-shadow: 0 0 0 0 rgba(139,92,246,.6); animation: pulsar 1.6s ease-out infinite; }
  #mensagem { transition: opacity .25s ease; }

  .rede { width: 470px; height: 100%; align-self: center; opacity: 0; animation: aparecer 1s ease 1.05s forwards; }
  .rede text { font-family: inherit; }

  .rodape { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 20px; height: 46px; padding: 0 28px; border-top: 1px solid var(--linha); background: rgba(255,255,255,.025); font-size: 12px; color: rgba(255,255,255,.5); opacity: 0; animation: aparecer .7s ease 1.7s forwards; }
  .dados { display: flex; align-items: center; gap: 18px; }
  .dados b { font-weight: 500; color: rgba(255,255,255,.8); }
  .licenca { display: none; align-items: center; gap: 7px; }
  .licenca i { width: 6px; height: 6px; border-radius: 50%; background: #34d399; }
  .licenca.alerta i { background: #fbbf24; }

  @keyframes surgir { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
  @keyframes focar { from { opacity: 0; filter: blur(12px); } to { opacity: 1; filter: blur(0); } }
  @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulsar { to { box-shadow: 0 0 0 10px rgba(139,92,246,0); } }
  @keyframes flutuar { to { transform: translate(60px, 40px) scale(1.12); } }
  @keyframes tracar { to { stroke-dashoffset: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
  <div class="palco">
    <div class="cartao">
      <div class="luz a"></div>
      <div class="luz b"></div>
      <div class="grade"></div>

      <div class="conteudo">
        <div class="marca">
          <div class="simbolo"><img src="logo.png" alt=""></div>
          <p class="laboratorio">RAIZAN LABS</p>
          <h1><span>Raizan Core</span></h1>
          <div class="frase"><p id="frase">Orquestrando operações empresariais.</p></div>
          <div class="etapa"><span class="pulso"></span><span id="mensagem" role="status">Inicializando serviços...</span></div>
        </div>
        <svg class="rede" id="rede" viewBox="0 0 470 520" aria-hidden="true"></svg>
      </div>

      <div class="rodape">
        <div class="dados">
          <span>Versão <b id="versao"></b></span>
          <span>Ambiente <b id="ambiente"></b></span>
          <span class="licenca" id="licenca"><i></i><b id="licencaTexto"></b></span>
        </div>
        <span>© <span id="ano"></span> Raizan Labs</span>
      </div>
    </div>
  </div>

<script>
  const MENSAGENS = ['Inicializando serviços...', 'Carregando integrações...', 'Sincronizando configurações...', 'Validando ambiente...', 'Preparando painel operacional...'];
  const FRASES = ['Orquestrando operações empresariais.', 'Conectando ERPs, vendas e logística.', 'Uma única plataforma para toda sua operação.', 'Transformando dados em decisões.'];
  const MODULOS = [
    { nome: 'ERP', x: 92, y: 118 },
    { nome: 'Marketplace', x: 372, y: 104 },
    { nome: 'E-commerce', x: 394, y: 306 },
    { nome: 'Força de Vendas', x: 262, y: 448 },
    { nome: 'PDV', x: 66, y: 356 },
  ];
  const CENTRO = { x: 236, y: 256 };
  const movimentoReduzido = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // A arte foi desenhada em 1000 de largura. Em telas menores a janela encolhe e o conteúdo acompanha.
  document.documentElement.style.zoom = innerWidth / 1000;

  const parametros = new URLSearchParams(location.search);
  document.getElementById('versao').textContent = parametros.get('versao') || '';
  document.getElementById('ambiente').textContent = parametros.get('ambiente') || '';
  document.getElementById('ano').textContent = new Date().getFullYear();

  const NS = 'http://www.w3.org/2000/svg';
  function criar(nome, atributos, pai) {
    const elemento = document.createElementNS(NS, nome);
    Object.entries(atributos).forEach(([chave, valor]) => elemento.setAttribute(chave, valor));
    pai.appendChild(elemento);
    return elemento;
  }

  function desenharRede() {
    const rede = document.getElementById('rede');
    const defs = criar('defs', {}, rede);
    const brilho = criar('radialGradient', { id: 'brilho' }, defs);
    criar('stop', { offset: '0%', 'stop-color': '#8b5cf6', 'stop-opacity': '.55' }, brilho);
    criar('stop', { offset: '100%', 'stop-color': '#8b5cf6', 'stop-opacity': '0' }, brilho);
    const fundo = criar('linearGradient', { id: 'nucleo', x1: '0', y1: '0', x2: '1', y2: '1' }, defs);
    criar('stop', { offset: '0%', 'stop-color': '#9333ea' }, fundo);
    criar('stop', { offset: '100%', 'stop-color': '#4f46e5' }, fundo);

    MODULOS.forEach((modulo, indice) => {
      const atraso = 1.2 + indice * 0.16;
      const caminho = `M${modulo.x} ${modulo.y} L${CENTRO.x} ${CENTRO.y}`;
      const tamanho = Math.hypot(modulo.x - CENTRO.x, modulo.y - CENTRO.y);

      const linha = criar('path', { d: caminho, fill: 'none', stroke: 'rgba(196,181,253,.3)', 'stroke-width': '1.2', 'stroke-dasharray': tamanho, 'stroke-dashoffset': tamanho }, rede);
      linha.style.animation = `tracar .8s ease ${atraso}s forwards`;

      if (movimentoReduzido) return;
      // O ERP alimenta o núcleo; os canais recebem dele e devolvem pedidos
      const particula = criar('circle', { r: '2.6', fill: '#ddd6fe', opacity: '0' }, rede);
      criar('animateMotion', { dur: '2.4s', begin: `${atraso + 0.6}s`, repeatCount: 'indefinite', path: indice === 0 ? caminho : `M${CENTRO.x} ${CENTRO.y} L${modulo.x} ${modulo.y}` }, particula);
      criar('animate', { attributeName: 'opacity', values: '0;1;1;0', keyTimes: '0;.15;.85;1', dur: '2.4s', begin: `${atraso + 0.6}s`, repeatCount: 'indefinite' }, particula);
    });

    criar('circle', { cx: CENTRO.x, cy: CENTRO.y, r: '112', fill: 'url(#brilho)' }, rede);
    criar('rect', { x: CENTRO.x - 62, y: CENTRO.y - 26, width: '124', height: '52', rx: '16', fill: 'url(#nucleo)', stroke: 'rgba(255,255,255,.25)' }, rede);
    const nucleo = criar('text', { x: CENTRO.x, y: CENTRO.y + 5, 'text-anchor': 'middle', fill: '#fff', 'font-size': '15', 'font-weight': '600' }, rede);
    nucleo.textContent = 'Raizan Core';

    MODULOS.forEach((modulo, indice) => {
      const grupo = criar('g', { opacity: '0' }, rede);
      grupo.style.animation = `aparecer .5s ease ${1.3 + indice * 0.16}s forwards`;
      const largura = 26 + modulo.nome.length * 7.3;
      criar('rect', { x: modulo.x - largura / 2, y: modulo.y - 17, width: largura, height: '34', rx: '11', fill: 'rgba(20,18,34,.92)', stroke: 'rgba(255,255,255,.14)' }, grupo);
      const rotulo = criar('text', { x: modulo.x, y: modulo.y + 4.5, 'text-anchor': 'middle', fill: 'rgba(255,255,255,.85)', 'font-size': '12.5' }, grupo);
      rotulo.textContent = modulo.nome;
    });
  }

  function trocarMensagem() {
    const elemento = document.getElementById('mensagem');
    let indice = 0;
    setInterval(() => {
      // Para na última: o sistema pode demorar mais e a fila não deve recomeçar
      if (indice === MENSAGENS.length - 1) return;
      indice += 1;
      elemento.style.opacity = 0;
      setTimeout(() => { elemento.textContent = MENSAGENS[indice]; elemento.style.opacity = 1; }, 240);
    }, 850);
  }

  function trocarFrase() {
    const elemento = document.getElementById('frase');
    let indice = 0;
    setInterval(() => {
      indice = (indice + 1) % FRASES.length;
      elemento.style.opacity = 0;
      elemento.style.transform = 'translateY(6px)';
      setTimeout(() => {
        elemento.textContent = FRASES[indice];
        elemento.style.transform = 'translateY(0)';
        elemento.style.opacity = 1;
      }, 450);
    }, 2200);
  }

  function mostrarLicenca({ texto, alerta }) {
    const elemento = document.getElementById('licenca');
    document.getElementById('licencaTexto').textContent = texto;
    elemento.classList.toggle('alerta', Boolean(alerta));
    elemento.style.display = 'inline-flex';
  }

  desenharRede();
  trocarMensagem();
  trocarFrase();

  if (window.splash) {
    window.splash.aoReceberLicenca(mostrarLicenca);
    window.splash.aoSair(() => document.body.classList.add('saindo'));
  }
</script>
</body>
</html>
